l_english:
  awr_birth_mother.t: "Your [GetPlayer.Custom2('RelationToMeShort', mother)|U] [mother.GetFirstNameNoTooltip|V] Had a Child"
  awr_birth_mother.desc: "[mother.GetRelationToString(GetPlayer)], [mother.GetFullName], had a child with [father.GetFullName]. They named [child.GetHerHim] [child.GetFirstName]."
  awr_birth_father.t: "Your [GetPlayer.Custom2('RelationToMeShort', father)|U] [father.GetFirstNameNoTooltip|V] Had a Child"
  awr_birth_father.desc: "[father.GetRelationToString(GetPlayer)], [father.GetFullName], had a child with [mother.GetFullName]. They named [child.GetHerHim] [child.GetFirstName]."
  awr_birth_mother_notable.t: "[mother.GetFirstNameNoTooltip|V] Had a Child"
  awr_birth_mother_notable.desc: "A person of interest to you, [mother.GetFullName], had a child with [father.GetFullName]. They named [child.GetHerHim] [child.GetFirstName]."
  awr_birth_father_notable.t: "[father.GetFirstNameNoTooltip|V] Had a Child"
  awr_birth_father_notable.desc: "A person of interest to you, [father.GetFullName], had a child with [mother.GetFullName]. They named [child.GetHerHim] [child.GetFirstName]."
  awr_death.t: "Your [GetPlayer.Custom2('RelationToMeShort', dead)|U] [dead.GetFirstNameNoTooltip|V] Died"
  awr_death.desc: "[dead.GetRelationToString(GetPlayer)], [dead.GetFullName], has died."

  awr_marriage.t: "Marriage: Your [GetPlayer.Custom2('RelationToMeShort', married.Self)|U] [married.GetFirstNameNoTooltip|V] and [spouse.GetFirstNameNoTooltip|V]"
  awr_marriage.desc: "[married.GetRelationToString(GetPlayer)], [married.GetFullName], married [spouse.GetFullName]."
  awr_marriage_notable.t: "Marriage: [married.GetFirstNameNoTooltip|V] and [spouse.GetFirstNameNoTooltip|V]"
  awr_marriage_notable.desc: "A person of interest to you, [married.GetFullName], married [spouse.GetFullName]."
  awr_divorce.t: "Divorce: Your [GetPlayer.Custom2('RelationToMeShort', divorced.Self)|U] [divorced.GetFirstNameNoTooltip|V] and [spouse.GetFirstNameNoTooltip|V]"
  awr_divorce.desc: "[divorced.GetRelationToString(GetPlayer)], [divorced.GetFullName], divorced [spouse.GetFullName]."
  awr_divorce_notable.t: "Divorce: [divorced.GetFirstNameNoTooltip|V] and [spouse.GetFirstNameNoTooltip|V]"
  awr_divorce_notable.desc: "A person of interest to you, [divorced.GetFullName], divorced [spouse.GetFullName]."

  awr_guest_arrival.t: "[guest.GetFirstNameNoTooltip|V] Arrived"
  awr_guest_arrival.desc: "[guest.GetFullName] has arrived at your court as a [guest|E]."
  awr_guest_departure.t: "[guest.GetFirstNameNoTooltip|V] Departed"
  awr_guest_departure.desc: "With no reason to stay, [guest.GetFullName] has left your court."
